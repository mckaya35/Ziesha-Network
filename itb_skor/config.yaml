# ITB Skor — tüm parametreler burada. Test sonucuna bakarak DEĞİŞTİRME.

# --- Veri ---
local_data_dir: ../python_port   # proje köküne göre; boş ("") ise yalnızca API. Bu klasör SADECE okunur.
local_market: unknown            # spot | futures | unknown (API ile örtüşme kontrolü raporlanır)
api_fill: true                   # eksik sembol/son dönem Binance USDT-M Futures API'den tamamlanır
api_start: "2020-01-01"          # yerelde hiç olmayan sembol için API başlangıcı
quote: USDT
data_dir: data                   # önbellek (API parçaları, funding)
out_dir: out
control_predictions: ""          # opsiyonel: önceki çalışmanın kontrol modeli tahminleri (CSV: symbol,time,score)

# --- Deneyler (ayrı raporlanır) ---
experiments:
  main:                          # Ana deney: 1h / 10 coin
    interval: 1h
    coins: [ADA, AVAX, BNB, BTC, DOGE, ETH, LINK, SOL, SUI, XRP]
    label: {H: 24, up: 0.02, adverse: 0.01}
    pine_file: ITB_Skor.pine
  exp4h:                         # İkinci deney: 4h / 20 coin (aynı yüzdeler, H=6 bar)
    interval: 4h
    coins: [AAVE, ADA, ATOM, AVAX, BCH, BNB, BTC, DOGE, DOT, ETC, ETH, FIL, LINK, LTC, NEAR, SOL, SUI, TRX, UNI, XRP]
    label: {H: 6, up: 0.02, adverse: 0.01}
    pine_file: ITB_Skor_4h.pine

# --- Ortak ---
features:
  windows: [6, 24, 72, 168]      # bar
  hour: true                     # hour_sin / hour_cos (UTC, bar açılış saati)

walkforward:
  train_months: 12
  test_months: 1
  first_test: auto               # auto = en erken veri başlangıcı + 12 ay, sonraki ay başı
  holdout_days: 90               # son 90 gün mühürlü; yalnızca en sonda bir kez raporlanır
  val_frac: 0.20                 # eğitim içi son %20 (zaman) = eşik seçimi için doğrulama
  C: 1.0
  thresholds: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
  min_val_trades: 20             # doğrulamada (tüm semboller toplamı) en az bu kadar işlem

costs:
  fee: 0.0005                    # taker, taraf başına
  slippage: 0.0002               # taraf başına

benchmark:
  random_reps: 1000
  seed: 42

criteria:
  min_trades: 300
  random_pct: 95
  year_frac: "2/3"               # pozitif yıl oranı (3 yılın 2'si), kesir
  cost_mult: 2.0
